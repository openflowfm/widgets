name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify version
        run: node --input-type=module -e 'import p from "./package.json" with { type:"json" }; if (process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: npm ci
      # The stories project renders every story in headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:storybook
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
